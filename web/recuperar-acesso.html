<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar acesso</title>
<style>body{margin:0;background:#101e30;color:#e8eff7;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{max-width:520px;margin:24px;padding:32px;border:1px solid #354a62;border-radius:18px}h1{font-size:25px}p{line-height:1.6;color:#c8d4e2}button,a{font:inherit;border:0;border-radius:9px;padding:12px 18px;background:#30c5e8;color:#062131;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{display:inline-block;margin-top:12px}a[hidden]{display:none}#status{min-height:3em}</style></head>
<body><main><h1>Recuperar acesso ao sistema</h1><p>Feche as outras abas do Gerenciador antes de continuar. Esta ação redefine apenas o login salvo neste navegador. Depois, você precisará entrar novamente.</p><p>Projetos, vínculos de pastas e planilhas, rascunhos e configurações serão preservados.</p><button id="recover">Recuperar meu acesso</button><p id="status" role="status" aria-live="polite"></p><a id="return" href="/" hidden>Voltar ao sistema</a></main><script src="auth_session_recovery.js"></script></body></html>
